<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gato Multijugador - Lobby</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="lobby-container">
        <h1>Gato (Tic-Tac-Toe) en Tiempo Real</h1>
        <div class="form-group">
            <label for="nickname">Tu Apodo:</label>
            <input type="text" id="nickname" placeholder="Ej: Juan" maxlength="15">
        </div>

        <div class="action-group">
            <h2>Crear Nueva Partida</h2>
            <button id="createGameBtn">Crear como Jugador "X"</button>
        </div>

        <div class="action-group">
            <h2>Unirse a Partida</h2>
            <input type="text" id="roomIdInput" placeholder="Ingresa el ID de la sala">
            <button id="joinGameBtn">Unirse como Jugador "O"</button>
        </div>
    </div>

    <!-- Lógica del lobby -->
    <script type="module" src="lobby.js"></script>

</body>
</html>
