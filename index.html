<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gato Multijugador - Lobby</title>
    <link rel="stylesheet" href="styles/style.css">
</head>
<body>
    <header class="app-header">
        <div class="header-title">
            <img src="img/gato-XO.jpeg" alt="Gato OX Logo" id="header-logo">
            <h1>GATO OX</h1>
        </div>
        <div class="theme-switcher-container">
            <input type="checkbox" id="theme-toggle" class="theme-switcher-checkbox">
            <label for="theme-toggle" class="theme-switcher-label">
                <span class="theme-switcher-thumb"></span>
            </label>
        </div>
    </header>

    <main class="main-content">
        <div class="lobby-container">
            
            <div class="form-group">
                <label for="create-nickname">Tu Apodo (para crear partida):</label>
                <input type="text" id="create-nickname" placeholder="Ej: Arianna" maxlength="15">
            </div>

            <div class="new-game-section">
                <h3>Iniciar Nueva Partida</h3>
                <div class="symbol-picker">
                    <span>Empezar como:</span>
                    <div class="symbol-options">
                        <button class="symbol-btn active" data-symbol="X">X</button>
                        <button class="symbol-btn" data-symbol="O">O</button>
                    </div>
                </div>
                <button id="createGameBtn" class="primary-btn">Crear Partida</button>
            </div>

            <div class="join-game-section">
                <button id="openJoinModalBtn" class="secondary-btn">¿Quieres ingresar a una partida existente?</button>
            </div>
        </div>
    </main>

    <!-- Modal para unirse a partida -->
    <div id="joinGameModal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h2>Unirse a Partida</h2>
            <p>Ingresa tu apodo y el código de la sala para unirte.</p>
            <div class="form-group">
                <input type="text" id="join-nickname" placeholder="Tu Apodo" maxlength="15">
            </div>
            <div class="form-group">
                <input type="text" id="roomIdInput" placeholder="Código de la sala">
            </div>
            <button id="joinGameBtn" class="primary-btn">Unirse a Partida</button>
        </div>
    </div>

    <script type="module" src="scripts/lobby.js"></script>
    <div class="watermark">JonaDev</div>
</body>
</html>
